name: Upload Wheels to Release

on:
  release:
    types: [published, created]

jobs:
  upload-wheels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Upload wheels to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the release tag from the event
          RELEASE_TAG=${{ github.event.release.tag_name }}
          
          echo "Uploading wheels for release: $RELEASE_TAG"
          
          # Find all .whl files in the wheels directory and upload them
          for wheel_file in wheels/*.whl; do
            if [ -f "$wheel_file" ]; then
              echo "Uploading: $wheel_file"
              gh release upload "$RELEASE_TAG" "$wheel_file" --clobber
            fi
          done
          
          echo "All wheels uploaded successfully!"
